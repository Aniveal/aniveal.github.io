            <div style="width:33%;">
                <input type="checkbox" id="repeat" style="font-size:70%;width:33%;"> <label for=repeat>Repeat </label>
            </div>
        
        </div>
        
        
        <div style="background-color:#FFE7BD; width:80vw; border:4px solid black; display:flex; align-items: center; justify-content: center;"><p id="status">Status: Keine Playlist Gewählt</p></div>

    <script>
        var listIndex = 0;
        
        var songList = [];

        function OnLoad()
        {
            CreateSongList(40, 7);
        }

        function songFinished()
        {
            if(!document.getElementById("repeat").checked)
                playNext();
            else
                Play(songList[listIndex]);
        }

        async function CreateSongList(t, element)
        {
            //UNTICK ALL BUTTONS
            var buttonList = document.getElementsByTagName("button");
            console.log(buttonList);
            for(var i = 0; i < buttonList.length; i++)
            {
                if(i == element)
                {
                    buttonList[i].classList.remove("tempoButton");
                    buttonList[i].classList.add("tempoButtonActive");
                }
                else{
                    buttonList[i].classList.remove("tempoButtonActive");
                    buttonList[i].classList.add("tempoButton");
                }
            }

            listIndex = 0;

            songList = [];

            var tempo = t;
            var response = await fetch('playlist.txt', {method: 'GET'});
            var files = await response.text();
            
            console.log(files);
            var fileList = files.replace(/\r/g, "").split("\n");
            console.log(fileList);

            if(files == null || files.length == 0)
            {
                StatusAlert("Status: Keine Playlist Gewählt");
                return;
            }

            for(var i = 0; i < fileList.length; i++)
            {
                if(fileList[i].includes("(" + tempo + ")"))
                    songList.push(fileList[i]);
            }
                

            if(songList.length == 0)
            {
                StatusAlert("Status: Keine Songs gefunden mit dem gewünschten Tempo");
                return;
            }
            
            songList = RandomShuffle(songList);
            Load(songList[listIndex]);
        }

        function playNext()
        {
            CheckAviability();

            listIndex = (listIndex + 1) % songList.length;
            Play(songList[listIndex]);
        }

        function playPrevious()
        {
            CheckAviability();

            listIndex = (listIndex - 1);
            if(listIndex < 0) 
                listIndex = songList.length - 1;
            Play(songList[listIndex]);
            
        }

        function CheckAviability()
        {
            if(songList.length == 0)
            {
                if(document.getElementById("fileInput").files.length == 0)
                    StatusAlert("Status: Keine Playlist Gewählt");
                else 
                    StatusAlert("Status: Keine Songs gefunden mit dem gewünschten Tempo");
                return;
            }
        }

        function getRandomSong() 
        {
            var tempo = document.getElementById("tempo").value;

            var files = document.getElementById("fileInput").files;

            if(files == null || files.length == 0)
            {
                StatusAlert("Status: Keine Playlist Gewählt");
                return;
            }
            
            var fileToPlay;
            var startIndex = Math.floor(Math.random() * files.length);
            var index = startIndex + 1;
            while(index != startIndex)
            {
                var file = files[index];
                if(file.name.includes("(" + tempo + ")"))
                {
                    fileToPlay = file;
                    break; 
                }

                index++;
                index %= files.length;
            }

            if(fileToPlay == null)
            {
                StatusAlert("Status: Keine Songs gefunden mit dem gewünschten Tempo");
                return;
            }

            Play(fileToPlay);
        }

        function RandomShuffle(array)
        {
            var i = array.length;
            var outArray = [];

            while(array.length > 0)
            {
                var randomIndex = Math.floor(Math.random() * array.length);
                outArray.push(array[randomIndex]);
                array.splice(randomIndex, 1);
            }

            return outArray;
        }

        function Load(file)
        {
            var audio = document.getElementById("audio");
            var source = document.getElementById("audioSource");
            source.src = file;
            console.log(source.src);
            audio.load();

            var status = document.getElementById("status");
            status.innerHTML = "Status: Spielt " + file.split("/")[2];
        }
        
        function Play(file)
        {
            var audio = document.getElementById("audio");
            var source = document.getElementById("audioSource");
            source.src = file;
            console.log(source.src);
            audio.load();
            audio.play();

            var status = document.getElementById("status");
            status.innerHTML = "Status: Spielt " + file.split("/")[2];
        }

        function StatusAlert(message)
        {
            var status = document.getElementById("status");
            status.innerHTML = message;
        }
        
    </script>
</body>
